
name: Install the python and node js
description: Installs Python and Node.js for use in workflows

inputs:
  python-version:
    description: Python version to install
    required: false
    default: '3.x'

  node-version:
    description: Node.js version to install
    required: false
    default: '22.x'

outputs:
  repo-owner:
    description: Repository owner
    value: ${{ steps.outputs-step.outputs.RepositoryOwner }}

runs:
  using: composite
  steps:
    - name: Install Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Set Outputs
      id: outputs-step
      shell: bash
      run: |
        echo "RepositoryOwner=${GITHUB_REPOSITORY_OWNER}" >> "$GITHUB_OUTPUT"
